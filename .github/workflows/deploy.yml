name: Deploy to BanaHosting

on:
  push:
    branches:
      - production

jobs:
  web-deploy:
    name: Deploy to FTP
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install PHP Dependencies
      run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction
      
    - name: Install NPM Dependencies & Build
      run: |
        npm ci
        npm run build
        
    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/**
          **/tests/**
          .env.example
          .editorconfig
          phpunit.xml
          README.md
          
    - name: Trigger Post-Deploy Artisan Commands
      run: |
        curl -f -s -S -X GET "https://turnero.maurotello.com.ar/api/deploy/trigger?token=${{ secrets.DEPLOY_TOKEN }}"
